<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DSAM — Бронирование компьютеров</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .app-container {
            max-width: 420px;
            width: 100%;
            background: #0f0f17;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 800px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(15, 15, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1f1f2e;
            min-height: 56px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            display: none;
            cursor: pointer;
            font-size: 20px;
            color: #00f0ff;
            padding: 4px;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f0ff, #b300ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .screen-title {
            font-size: 18px;
            font-weight: 700;
            display: none;
        }
        .header-icons {
            display: flex;
            gap: 16px;
            font-size: 20px;
        }
        .header-icons span {
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }
        .header-icons span:hover { opacity: 1; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 80px;
        }

        .balance-widget {
            margin: 12px 0;
            padding: 12px 16px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .balance-widget:hover { border-color: #00f0ff; }
        .balance-label { font-size: 14px; color: #aaa; }
        .balance-amount { font-size: 20px; font-weight: bold; color: #00f0ff; }

        .search-bar {
            margin: 0 0 12px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2a2a4a;
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            font-size: 15px;
        }
        .search-bar input::placeholder { color: #666; }

        .view-toggle {
            display: flex;
            margin: 0 0 12px;
            background: #1a1a2e;
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }
        .view-toggle button {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #888;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: #00f0ff22;
            color: #00f0ff;
            box-shadow: 0 0 10px #00f0ff33;
        }

        .club-list { display: flex; flex-direction: column; gap: 12px; }
        .club-card {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            transition: 0.2s;
            cursor: pointer;
        }
        .club-card:hover { border-color: #00f0ff44; }
        .club-header { display: flex; justify-content: space-between; align-items: start; }
        .club-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .club-rating { color: #ffcc00; font-size: 14px; }
        .club-address { font-size: 13px; color: #999; margin: 4px 0; }
        .club-status { font-size: 13px; margin: 4px 0; }
        .status-open { color: #4cff4c; }
        .status-closed { color: #ff4c4c; }
        .club-price { font-size: 14px; color: #00f0ff; margin-top: 8px; font-weight: 500; }

        .club-detail-photo {
            width: 100%;
            height: 180px;
            background: #1a1a2e;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 48px;
            overflow: hidden;
        }
        .club-detail-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }
        .club-detail-info {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            margin-bottom: 12px;
        }
        .club-detail-info div {
            margin-bottom: 6px;
            font-size: 14px;
        }
        .hall-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
        }
        .hall-tab {
            padding: 8px 16px;
            background: #1a1a2e;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .hall-tab.active {
            border-color: #00f0ff;
            color: #00f0ff;
            background: #00f0ff11;
        }
        .hall-detail {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            margin-bottom: 12px;
        }
        .hall-detail h4 { margin-bottom: 8px; }
        .hall-specs { font-size: 13px; color: #aaa; margin-bottom: 4px; }
        .package-list { margin-top: 12px; }
        .package-item {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .package-item:hover { background: #222240; }
        .package-item.selected {
            border-color: #00f0ff;
            background: #00f0ff11;
        }
        .btn-book {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f0ff, #b300ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-book:hover { opacity: 0.9; }
        .btn-book:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .booking-section {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            margin-bottom: 12px;
        }
        .booking-section h3 {
            margin-bottom: 12px;
            font-size: 15px;
            color: #aaa;
        }
        .date-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .date-item {
            min-width: 60px;
            padding: 10px 8px;
            background: #1a1a2e;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .date-item.active {
            border-color: #00f0ff;
            background: #00f0ff11;
        }
        .date-item .day { font-size: 12px; color: #999; }
        .date-item .date { font-size: 16px; font-weight: 700; }
        .date-item .month { font-size: 11px; color: #999; }
        .time-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            flex-wrap: wrap;
        }
        .time-item {
            padding: 8px 14px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .time-item.active {
            border-color: #00f0ff;
            background: #00f0ff11;
            color: #00f0ff;
        }
        .time-item.blocked {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .duration-select {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .duration-item {
            padding: 8px 16px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .duration-item.active {
            border-color: #00f0ff;
            background: #00f0ff11;
            color: #00f0ff;
        }
        .computer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .computer-item {
            aspect-ratio: 1;
            background: #1a1a2e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .computer-item.available { border-color: #4cff4c44; }
        .computer-item.available:hover { border-color: #4cff4c; }
        .computer-item.selected {
            border-color: #00f0ff;
            background: #00f0ff22;
            color: #00f0ff;
        }
        .computer-item.occupied {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #ff4c4c44;
        }
        .booking-summary {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            margin-top: 12px;
        }
        .booking-summary h3 { margin-bottom: 8px; }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            border-top: 1px solid #1f1f2e;
            margin-top: 8px;
        }
        .game-input {
            width: 100%;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: white;
            margin-top: 8px;
            font-size: 14px;
        }
        .game-input::placeholder { color: #666; }

        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .auth-container .logo-large {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00f0ff, #b300ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .auth-container h2 { margin-bottom: 8px; font-size: 20px; }
        .auth-container p { color: #888; margin-bottom: 24px; text-align: center; }
        .auth-input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .auth-input:focus { outline: none; border-color: #00f0ff; }
        .auth-input::placeholder { color: #666; }
        .auth-error { color: #ff4c4c; font-size: 13px; margin-bottom: 8px; display: none; }
        .auth-switch { color: #888; margin-top: 16px; font-size: 14px; }
        .auth-switch span { color: #00f0ff; cursor: pointer; font-weight: 600; }

        .profile-header { text-align: center; padding: 24px 0; }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00f0ff, #b300ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px;
        }
        .profile-name { font-size: 22px; font-weight: 700; }
        .profile-phone { color: #999; font-size: 14px; }
        .profile-section {
            background: #12121f;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f1f2e;
            margin-bottom: 12px;
        }
        .profile-section h3 { margin-bottom: 12px; font-size: 15px; color: #aaa; }
        .profile-menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1f1f2e;
            cursor: pointer;
            font-size: 15px;
        }
        .profile-menu-item:last-child { border-bottom: none; }
        .profile-menu-item .arrow { color: #666; }
        .btn-logout {
            display: block;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #ff4c4c44;
            border-radius: 12px;
            color: #ff4c4c;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #ff4c4c11; }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px;
            border-top: 1px solid #1f1f2e;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #777;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active { color: #00f0ff; }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        .loading { text-align: center; padding: 40px; color: #666; }
        .screen { display: none; }
        .screen.active { display: block; }
        .map-placeholder {
            display: none;
            height: 200px;
            background: #1a1a2e;
            border-radius: 16px;
            align-items: center;
            justify-content: center;
            color: #666;
            margin-bottom: 16px;
        }
        .success-animation { text-align: center; padding: 40px 20px; }
        .success-animation .icon { font-size: 64px; margin-bottom: 16px; }
        .success-animation h2 { color: #4cff4c; margin-bottom: 8px; }

        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-track { background: transparent; }
        .content::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <span class="back-btn" id="backBtn" onclick="goBack()">←</span>
                <span class="logo" id="headerLogo">DSAM</span>
                <span class="screen-title" id="screenTitle"></span>
            </div>
            <div class="header-icons">
                <span>🔔</span>
                <span>⚙️</span>
                <span onclick="navigateTo('profile')" style="cursor:pointer;">👤</span>
            </div>
        </div>

        <div class="content" id="contentArea">
            <div id="screen-home" class="screen active">
                <div class="balance-widget" onclick="navigateTo('profile')">
                    <div>
                        <div class="balance-label">💰 Бонусный баланс</div>
                        <div class="balance-amount" id="homeBalance">0 бонусов</div>
                    </div>
                    <span style="font-size:20px;">›</span>
                </div>
                <div class="search-bar">
                    <span>🔍</span>
                    <input type="text" placeholder="Поиск клуба..." id="searchInput" oninput="filterClubs()">
                </div>
                <div class="view-toggle">
                    <button id="btnMap" onclick="switchView('map')">📍 Карта</button>
                    <button id="btnList" class="active" onclick="switchView('list')">📋 Список</button>
                </div>
                <div id="mapView" class="map-placeholder">🗺️ Карта клубов (будет позже)</div>
                <div id="clubsContainer" class="club-list">
                    <div class="loading">🔄 Загрузка клубов...</div>
                </div>
            </div>

            <div id="screen-club" class="screen">
                <div id="clubDetailContent">
                    <div class="loading">🔄 Загрузка...</div>
                </div>
            </div>

            <div id="screen-booking" class="screen">
                <div id="bookingContent">
                    <div class="loading">🔄 Загрузка...</div>
                </div>
            </div>

            <div id="screen-success" class="screen">
                <div class="success-animation">
                    <div class="icon">✅</div>
                    <h2>Бронь подтверждена!</h2>
                    <p style="color:#aaa;" id="successDetails"></p>
                    <button class="btn-book" style="margin-top:20px;" onclick="navigateTo('home')">🏠 На главную</button>
                </div>
            </div>

            <div id="screen-auth" class="screen">
                <div class="auth-container">
                    <div class="logo-large">DSAM</div>
                    <h2 id="authTitle">Регистрация</h2>
                    <p id="authSubtitle">Введите данные для бронирования</p>
                    <input type="text" class="auth-input" id="authName" placeholder="Ваше имя">
                    <input type="tel" class="auth-input" id="authPhone" placeholder="+998 XX XXX XX XX" oninput="formatPhoneInput(this)" maxlength="17">
                    <div class="auth-error" id="authError">Ошибка</div>
                    <button class="btn-book" onclick="handleAuth()" id="authBtn">Зарегистрироваться</button>
                    <div class="auth-switch" id="authSwitch">
                        Уже есть аккаунт? <span onclick="toggleAuthMode()">Войти</span>
                    </div>
                </div>
            </div>

            <div id="screen-profile" class="screen">
                <div id="profileContent">
                    <div class="loading">🔄 Загрузка...</div>
                </div>
            </div>

            <div id="screen-bookings" class="screen">
                <div class="loading">🔄 Загрузка броней...</div>
            </div>
        </div>

        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item active" data-screen="home" onclick="navigateTo('home')">
                <span>🏠</span>Главная
            </div>
            <div class="nav-item" data-screen="bookings" onclick="navigateTo('bookings')">
                <span>📅</span>Брони
            </div>
            <div class="nav-item" data-screen="profile" onclick="navigateTo('profile')">
                <span>👤</span>Профиль
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://script.google.com/macros/s/AKfycbyKOuZ7iu77ZZYFQURDcw-v0E64xF_hwhi-JO8vI8fdz1EsBG2nDH_e4qnd0m97FrA/exec';

        let currentScreen = 'home';
        let screenHistory = ['home'];
        let currentClubId = null;
        let allClubs = [];
        let currentPlayer = null;
        let authMode = 'register';
        const BONUS_MAX_REDEEM_PERCENT = 50; // должно совпадать со значением в Code.gs
        let bookingState = {
            clubId: null, hallId: null, date: null, time: null,
            duration: 1, computerId: null, game: '',
            pricePerHour: 0, totalPrice: 0, packageSelected: null,
            useBonus: false, bonusApplied: 0
        };
        function toggleUseBonus() {
            bookingState.useBonus = !bookingState.useBonus;
            updateBookingSummary();
        }

        // Маска телефона: приводит ввод к формату +998 XX XXX XX XX
        function formatPhoneInput(input) {
            let digits = input.value.replace(/\D/g, '');
            if (digits.startsWith('998')) digits = digits.slice(3);
            digits = digits.slice(0, 9);
            let formatted = '+998';
            if (digits.length > 0) formatted += ' ' + digits.slice(0, 2);
            if (digits.length > 2) formatted += ' ' + digits.slice(2, 5);
            if (digits.length > 5) formatted += ' ' + digits.slice(5, 7);
            if (digits.length > 7) formatted += ' ' + digits.slice(7, 9);
            input.value = formatted;
        }
        function isValidUzPhone(phone) {
            const digits = phone.replace(/\D/g, '');
            return /^998\d{9}$/.test(digits);
        }

        function checkAuth() {
            const saved = localStorage.getItem('dsam_player');
            if (saved) { currentPlayer = JSON.parse(saved); updateBalanceDisplay(); return true; }
            return false;
        }
        function savePlayer(player) {
            currentPlayer = player;
            localStorage.setItem('dsam_player', JSON.stringify(player));
            updateBalanceDisplay();
        }
        function logoutPlayer() {
            currentPlayer = null;
            localStorage.removeItem('dsam_player');
            updateBalanceDisplay();
            navigateTo('home');
        }
        function updateBalanceDisplay() {
            const balance = currentPlayer ? currentPlayer.bonus_balance : 0;
            const el = document.getElementById('homeBalance');
            if (el) el.textContent = (balance || 0).toLocaleString() + ' бонусов';
        }

        function navigateTo(screen, params = null) {
            const protectedScreens = ['profile', 'bookings'];
            if (protectedScreens.includes(screen) && !checkAuth()) {
                screenHistory.push(screen);
                showAuthScreen();
                return;
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screen).classList.add('active');
            if (screen !== currentScreen) { screenHistory.push(screen); currentScreen = screen; }
            const backBtn = document.getElementById('backBtn');
            const logo = document.getElementById('headerLogo');
            const title = document.getElementById('screenTitle');
            const bottomNav = document.getElementById('bottomNav');
            if (screen === 'home' || screen === 'auth') {
                backBtn.style.display = 'none'; logo.style.display = 'inline';
                title.style.display = 'none'; bottomNav.style.display = screen === 'home' ? 'flex' : 'none';
                if (screen === 'home') screenHistory = ['home'];
            } else {
                backBtn.style.display = 'inline'; logo.style.display = 'none';
                title.style.display = 'inline'; bottomNav.style.display = 'none';
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.screen === screen));

        function toggleAuthMode() { authMode = authMode === 'register' ? 'login' : 'register'; updateAuthUI(); }
        function updateAuthUI() {
            document.getElementById('authError').style.display = 'none';
            if (authMode === 'register') {
                document.getElementById('authTitle').textContent = 'Регистрация';
                document.getElementById('authSubtitle').textContent = 'Введите данные для бронирования';
                document.getElementById('authName').style.display = 'block';

            } else {
                document.getElementById('authTitle').textContent = 'Вход';
                document.getElementById('authSubtitle').textContent = 'Введите номер телефона';
                document.getElementById('authName').style.display = 'none';
                document.getElementById('authBtn').textContent = 'Войти';
                document.getElementById('authSwitch').innerHTML = 'Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span>';

        async function handleAuth() {
            const name = document.getElementById('authName').value.trim();
            const phone = document.getElementById('authPhone').value.trim();
            const errEl = document.getElementById('authError');
            errEl.style.display = 'none';
            if (!phone) { errEl.textContent = 'Введите номер телефона'; errEl.style.display = 'block'; return; }
            if (!isValidUzPhone(phone)) { errEl.textContent = 'Введите корректный номер: +998 XX XXX XX XX'; errEl.style.display = 'block'; return; }
            if (authMode === 'register' && !name) { errEl.textContent = 'Введите имя'; errEl.style.display = 'block'; return; }
            const btn = document.getElementById('authBtn');
            btn.textContent = 'Загрузка...'; btn.disabled = true;
            try {
                let url = authMode === 'register'
                    ? API_BASE + '?action=register&name=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone)
                    : API_BASE + '?action=login&phone=' + encodeURIComponent(phone);
                const resp = await fetch(url); const data = await resp.json();
                if (data.error) {
                    errEl.textContent = data.error === 'Player not found' ? 'Аккаунт не найден' : data.error;
                    errEl.style.display = 'block';
                } else {
                    savePlayer(data);
                    const target = screenHistory.length > 1 ? screenHistory[screenHistory.length - 2] : 'home';
                    navigateTo(['profile', 'bookings'].includes(target) ? target : 'home');
                }
            } catch(e) { errEl.textContent = 'Ошибка соединения'; errEl.style.display = 'block'; }
            btn.textContent = authMode === 'register' ? 'Зарегистрироваться' : 'Войти';
            btn.disabled = false;
        }

        function startBooking(clubId, hallId, pricePerHour) {
            if (!checkAuth()) { showAuthScreen(); return; }
            bookingState = { clubId, hallId, date: new Date(), time: null, duration: 1, computerId: null, game: '', pricePerHour, totalPrice: pricePerHour, packageSelected: null };
            currentClubId = clubId;
            document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
            document.getElementById('screen-booking').classList.add('active');
            document.getElementById('backBtn').style.display='inline';

            document.getElementById('screenTitle').style.display='inline';
            document.getElementById('screenTitle').textContent='Бронирование';
            document.getElementById('bottomNav').style.display='none';
            screenHistory.push('booking'); currentScreen='booking';
            loadBookingScreen(clubId, hallId, pricePerHour);
        }
        function loadBookingScreen(clubId, hallId, pricePerHour) {
            let club = allClubs.find(c=>c.id===clubId)||{id:clubId,name:'Клуб',halls:[]};
            let hall = (club.halls||[]).find(h=>h.id===hallId)||{id:hallId,name:'Зал',base_price_hour:pricePerHour||15000,specs:'',total_computers:10,free_now:5,packages:[]};
            const dates=[];
            for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);dates.push(d);}
            const slots=[];
            for(let h=9;h<26;h++){const hr=h%24;slots.push(`${hr.toString().padStart(2,'0')}:00`,`${hr.toString().padStart(2,'0')}:30`);}
            const comps=[];
            for(let i=1;i<=(hall.total_computers||10);i++)comps.push({id:i,number:i,occupied:i>(hall.free_now||5)});
            bookingState.date=dates[0]; bookingState.computers=comps;
            bookingState.pricePerHour=hall.base_price_hour||pricePerHour;
            bookingState.totalPrice=bookingState.pricePerHour;
            bookingState.useBonus=false; bookingState.bonusApplied=0;
            renderBookingScreen(club,hall,dates,slots,comps);
        }
        function renderBookingScreen(club,hall,dates,slots,comps){
            const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
            const dn=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
            document.getElementById('bookingContent').innerHTML=`
                <div style="margin-bottom:8px;color:#aaa;font-size:13px;">${club.name} · ${hall.name} · ${hall.base_price_hour.toLocaleString()} сум/час</div>
                ${hall.packages&&hall.packages.length?`<div class="booking-section"><h3>🎮 Пакеты клуба</h3><div class="package-list">${hall.packages.map(p=>`<div class="package-item" onclick="selectPackage('${p.replace(/'/g,"\\'")}')"><span>${p}</span><span>›</span></div>`).join('')}</div></div>`:''}
                <div class="booking-section"><h3>📅 Дата</h3><div class="date-scroll">${dates.map((d,i)=>`<div class="date-item ${i===0?'active':''}" onclick="selectDate(${i})" data-date-index="${i}"><div class="day">${i===0?'Сегодня':i===1?'Завтра':dn[d.getDay()]}</div><div class="date">${d.getDate()}</div><div class="month">${m[d.getMonth()]}</div></div>`).join('')}</div></div>
                <div class="booking-section"><h3>⏰ Время начала</h3><div class="time-scroll">${slots.map(t=>`<div class="time-item" onclick="selectTime('${t}')" data-time="${t}">${t}</div>`).join('')}</div></div>
                <div class="booking-section"><h3>⏱ Длительность</h3><div class="duration-select">
                    <div class="duration-item active" onclick="selectDuration(1)" data-dur="1">1 час</div>
                    <div class="duration-item" onclick="selectDuration(2)" data-dur="2">2 часа</div>
                    <div class="duration-item" onclick="selectDuration(3)" data-dur="3">3 часа</div>
                    <div class="duration-item" onclick="selectDuration(5)" data-dur="5">5 часов</div>
                </div></div>
                <div class="booking-section"><h3>💻 Выберите компьютер</h3><div class="computer-grid">${comps.map(c=>`<div class="computer-item ${c.occupied?'occupied':'available'}" onclick="${c.occupied?'':`selectComputer(${c.id})`}" data-computer-id="${c.id}">${c.number}</div>`).join('')}</div></div>
                <div class="booking-section"><h3>🎮 Какую игру хотите сыграть?</h3><input type="text" class="game-input" placeholder="CS2, Dota 2, FIFA..." oninput="bookingState.game=this.value"></div>
                <div class="booking-summary" id="bookingSummary">
                    <h3>📋 Детали брони</h3>
                    <div class="summary-row"><span>Клуб:</span><span>${club.name}</span></div>
                    <div class="summary-row"><span>Зал:</span><span>${hall.name}</span></div>
                    <div class="summary-row" id="summaryDate"><span>Дата:</span><span>—</span></div>
                    <div class="summary-row" id="summaryTime"><span>Время:</span><span>—</span></div>
                    <div class="summary-row" id="summaryDuration"><span>Длительность:</span><span>—</span></div>
                    <div class="summary-row" id="summaryComputer"><span>Компьютер:</span><span>—</span></div>
                    ${currentPlayer && (currentPlayer.bonus_balance||0) > 0 ? `
                    <div class="summary-row" id="bonusToggleRow" style="align-items:center;cursor:pointer;" onclick="toggleUseBonus()">
                        <span>🎁 Списать бонусы (${(currentPlayer.bonus_balance||0).toLocaleString()} доступно)</span>
                        <span id="bonusToggleState">Выкл</span>
                    </div>
                    <div class="summary-row" id="summaryBonusApplied" style="display:none;"><span>Скидка бонусами:</span><span>—</span></div>
                    ` : ''}
                    <div class="summary-total" id="summaryTotal"><span>Итого:</span><span>${hall.base_price_hour.toLocaleString()} сум</span></div>
                </div>
                <button class="btn-book" id="btnPay" disabled onclick="processPayment()">💰 Оплатить через Click</button>
            `;
            updateBookingSummary();
        }
        function selectDate(i){
            document.querySelectorAll('.date-item').forEach(e=>e.classList.remove('active'));
            document.querySelector(`[data-date-index="${i}"]`).classList.add('active');
            const d=new Date();d.setDate(d.getDate()+i);bookingState.date=d;updateBookingSummary();
        }
        function selectTime(t){
            document.querySelectorAll('.time-item').forEach(e=>e.classList.remove('active'));
            const el=document.querySelector(`[data-time="${t}"]`);if(el)el.classList.add('active');
            bookingState.time=t;updateBookingSummary();
        }
        function selectDuration(h){
            document.querySelectorAll('.duration-item').forEach(e=>e.classList.remove('active'));
            document.querySelector(`[data-dur="${h}"]`).classList.add('active');
            bookingState.duration=h;bookingState.totalPrice=bookingState.pricePerHour*h;
            bookingState.packageSelected=null;
            document.querySelectorAll('.package-item').forEach(e=>e.classList.remove('selected'));
            updateBookingSummary();
        }
        function selectPackage(p){
            document.querySelectorAll('.package-item').forEach(e=>e.classList.remove('selected'));
            event.target.closest('.package-item').classList.add('selected');
            bookingState.packageSelected=p;
            document.querySelectorAll('.duration-item').forEach(e=>e.classList.remove('active'));
            bookingState.duration=1;bookingState.totalPrice=bookingState.pricePerHour;
            updateBookingSummary();
        }
        function selectComputer(id){
            document.querySelectorAll('.computer-item').forEach(e=>e.classList.remove('selected'));
            document.querySelector(`[data-computer-id="${id}"]`).classList.add('selected');
            bookingState.computerId=id;updateBookingSummary();
        }
        function updateBookingSummary(){
            const ds=bookingState.date?bookingState.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'—';
            const ts=bookingState.time||'—';
            const dur=bookingState.packageSelected||`${bookingState.duration} час(а)`;
            const cs=bookingState.computerId?`№${bookingState.computerId}`:'—';
            const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v;};
            set('summaryDate',`<span>Дата:</span><span>${ds}</span>`);
            set('summaryTime',`<span>Время:</span><span>${ts}</span>`);
            set('summaryDuration',`<span>Длительность:</span><span>${dur}</span>`);
            set('summaryComputer',`<span>Компьютер:</span><span>${cs}</span>`);

            // Расчёт бонусов
            const balance = currentPlayer ? (currentPlayer.bonus_balance||0) : 0;
            const maxByPercent = Math.floor(bookingState.totalPrice * BONUS_MAX_REDEEM_PERCENT / 100);
            bookingState.bonusApplied = bookingState.useBonus ? Math.min(balance, maxByPercent) : 0;

            const toggleState = document.getElementById('bonusToggleState');
            if (toggleState) toggleState.textContent = bookingState.useBonus ? 'Вкл' : 'Выкл';
            const bonusRow = document.getElementById('summaryBonusApplied');
            if (bonusRow) {
                if (bookingState.bonusApplied > 0) {
                    bonusRow.style.display = 'flex';
                    bonusRow.innerHTML = `<span>Скидка бонусами:</span><span>−${bookingState.bonusApplied.toLocaleString()} сум</span>`;
                } else {
                    bonusRow.style.display = 'none';
                }
            }

            const finalTotal = Math.max(0, bookingState.totalPrice - bookingState.bonusApplied);
            set('summaryTotal',`<span>Итого:</span><span>${finalTotal.toLocaleString()} сум</span>`);
            const btn=document.getElementById('btnPay');
            if(btn)btn.disabled=!(bookingState.time&&bookingState.computerId);
        }
        async function processPayment(){
            if(!currentPlayer){alert('Необходимо авторизоваться');return;}
            const btn=document.getElementById('btnPay');
            btn.textContent='Создание брони...';btn.disabled=true;
            try{
                const d=new Date(bookingState.date);
                const [h,m]=(bookingState.time||'00:00').split(':');
                d.setHours(parseInt(h),parseInt(m),0,0);
                const bonusUsed = bookingState.bonusApplied || 0;
                const url=API_BASE+'?action=create_booking&player_phone='+encodeURIComponent(currentPlayer.phone)+'&computer_id='+bookingState.computerId+'&start_time='+d.toISOString()+'&hours='+bookingState.duration+'&game='+encodeURIComponent(bookingState.game)+'&payment_method=click&bonus_used='+bonusUsed;
                const r=await fetch(url);const data=await r.json();
                if(data.success){
                    if (typeof data.new_bonus_balance === 'number') {
                        currentPlayer.bonus_balance = data.new_bonus_balance;
                        localStorage.setItem('dsam_player', JSON.stringify(currentPlayer));
                        updateBalanceDisplay();
                    }
                    const finalTotal = Math.max(0, bookingState.totalPrice - bonusUsed);
                    const bonusNote = data.bonus_earned ? `\n🎁 Начислено бонусов: +${data.bonus_earned.toLocaleString()}` : '';
                    document.getElementById('successDetails').textContent=`Бронь на ${d.toLocaleDateString('ru-RU')}, ${bookingState.time}, комп №${bookingState.computerId}\nСумма: ${finalTotal.toLocaleString()} сум${bonusUsed?` (списано ${bonusUsed.toLocaleString()} бонусов)`:''}${bonusNote}`;
                    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
                    document.getElementById('screen-success').classList.add('active');
                    document.getElementById('backBtn').style.display='inline';
                    document.getElementById('headerLogo').style.display='none';
                    document.getElementById('screenTitle').style.display='inline';
                    document.getElementById('screenTitle').textContent='Бронь';
                    document.getElementById('bottomNav').style.display='none';
                }else{alert('Ошибка: '+(data.error||'Неизвестная ошибка'));}
            }catch(e){alert('Ошибка соединения');}
            btn.textContent='💰 Оплатить через Click';btn.disabled=false;
        }

        async function loadMyBookings(){
            if(!currentPlayer){showAuthScreen();return;}
            const c=document.getElementById('screen-bookings');
            c.innerHTML='<div class="loading">🔄 Загрузка броней...</div>';

        function renderBookings(bookings){

            if(!bookings.length){
                c.innerHTML=`<div style="text-align:center;padding:40px 20px;"><div style="font-size:48px;margin-bottom:16px;">📅</div><h3>Нет броней</h3><p style="color:#888;margin-top:8px;">Забронируйте компьютер в любимом клубе</p><button class="btn-book" style="margin-top:20px;" onclick="navigateTo('home')">🏠 На главную</button></div>`;
                return;
            }
            const sm={upcoming:{emoji:'🟢',label:'Предстоит',color:'#4cff4c'},active:{emoji:'🟡',label:'Активна',color:'#ffcc00'},completed:{emoji:'✅',label:'Завершена',color:'#888'},cancelled:{emoji:'❌',label:'Отменена',color:'#ff4c4c'}};
            c.innerHTML=bookings.map(b=>{
                const s=sm[b.status]||sm.upcoming;
                const sd=new Date(b.start_time);
                const ed=new Date(b.end_time);
                return `<div class="booking-section" style="cursor:pointer;" onclick="navigateTo('club',${b.club_id})">
                    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">
                        <div><div style="font-weight:700;font-size:15px;">${b.club_name}</div><div style="color:#888;font-size:12px;">${b.hall_name} · Комп №${b.computer_number}</div></div>
                        <div style="text-align:right;"><span style="color:${s.color};font-size:13px;">${s.emoji} ${s.label}</span></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:13px;color:#aaa;">
                        <span>📅 ${sd.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span>
                        <span>⏰ ${sd.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} – ${ed.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} (${b.hours}ч)</span>
                    </div>
                    ${b.game?`<div style="margin-top:6px;font-size:12px;color:#888;">🎮 ${b.game}</div>`:''}
                </div>`;
            }).join('')+'<button class="btn-book" style="margin-top:12px;" onclick="navigateTo(\'home\')">🏠 На главную</button>';
        }

        document.getElementById('mapView').style.display='none';
        checkAuth();updateBalanceDisplay();loadClubs();

        // Регистрация service worker — делает приложение устанавливаемым (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed:', e));
            });
        }
    </script>
</body>
</html>
